name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.22"
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups --all-extras
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Build, extract and offline validate matching production profile
        run: uv run --no-sync python scripts/check_release_artifacts.py --platform-smoke dist/platform-smoke
      - name: Prepare pinned macOS native runtime without installing services
        if: runner.os == 'macOS'
        run: |
          candidate="$PWD/dist/platform-smoke/public/LiteChecker/_app"
          bash "$candidate/scripts/native-direct.sh" prepare --root "$candidate"
          "$candidate/.native-direct/venv/bin/python" -I -B -c 'import sys; from pathlib import Path; sys.path.insert(0,sys.argv[1]+"/src"); from litechecker.native_runtime import validate_native_runtime; print(validate_native_runtime(Path(sys.argv[1])).python)' "$candidate"
          "$candidate/.native-direct/venv/bin/python" -I -B -m litechecker.cli --help
      - name: Build profiled Linux image and run offline CLI
        if: runner.os == 'Linux'
        run: |
          docker build --tag litechecker:profile-ci dist/platform-smoke/public/LiteChecker
          docker run --rm --network none litechecker:profile-ci --help
      - name: Build and check author wheel and sdist
        run: |
          uv build --offline --out-dir dist/author
          uv run --no-sync python scripts/check_release_artifacts.py dist/author
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.22"
          python-version: "3.12.11"
          enable-cache: false
      - name: Install locked native dependencies
        id: native-deps
        run: uv sync --frozen --all-groups
      - name: Compare native ACL ownership with Windows token defaults
        run: uv run --no-sync python tests/windows_acl_diagnostic.py
      - name: Diagnose atomic JSON replacement with a real Windows held reader
        run: uv run --no-sync python tests/windows_atomic_diagnostic.py
      - name: Build, extract and offline validate matching Windows public wrapper
        run: uv run --no-sync python scripts/check_release_artifacts.py --platform-smoke dist/platform-smoke
      - name: Test native runtime, process ownership, ACLs and update transactions
        if: ${{ !cancelled() && steps.native-deps.outcome == 'success' }}
        # Public profile ZIPs must also build on Windows. Signing/private-key
        # author gates remain on POSIX; Windows exercises actual NTFS/Job APIs.
        run: >-
          uv run --no-sync pytest -vv -o faulthandler_timeout=45
          tests/test_windows_network.py tests/test_windows_trial.py
          tests/test_windows_diagnostics.py tests/test_windows_doh.py
          tests/test_atomic_io.py
          tests/test_windows_doh_preflight.py tests/test_windows_control.py
          tests/test_windows_child_process.py
          tests/test_windows_app.py tests/test_windows_app_entry.py
          tests/test_windows_setup_flow.py
          tests/test_active_menu.py tests/test_packaged_smoke.py
          tests/test_release_artifact_writer.py
          tests/test_windows_bootstrap.py tests/test_windows_update.py
          tests/test_windows_update_storage.py tests/test_windows_update_native.py
      - name: Prepare actual pinned Windows runtime from a clean folder
        if: ${{ !cancelled() && steps.native-deps.outcome == 'success' }}
        env:
          LC_WINDOWS_BOOTSTRAP_SMOKE: "1"
        run: uv run --no-sync pytest tests/test_windows_bootstrap_runtime.py -v
