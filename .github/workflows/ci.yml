name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.8.22"
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups --all-extras
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Build public client archive
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --no-sync python scripts/package_agent.py
      - name: Validate public client archive
        run: >-
          uv run --no-sync python -c
          "from pathlib import Path;
          from litechecker.update_store import validate_source_zip;
          validate_source_zip(Path('dist/LiteChecker-agent.zip').read_bytes())"
