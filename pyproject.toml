[project]
name = "litechecker"
version = "0.6.0"
description = "Multi-city VLESS/REALITY availability monitor"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.1",
    "dnspython==2.8.0",
    "filelock==3.32.4",
    "httpx[socks]>=0.28,<1",
    "psutil==7.1.3",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
collector = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
litechecker = "litechecker.cli:main"
litechecker-smoke-subscription = "litechecker.smoke:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "trustme>=1.2,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litechecker"]
only-packages = true
exclude = [
    "/.superpowers",
    "/.worktrees",
    "/secrets",
    "/tests",
    "**/*.diff",
    "**/*.report",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/litechecker",
    "/pyproject.toml",
    "/README.md",
    "/.gitignore",
]
exclude = [
    "/.superpowers",
    "/.worktrees",
    "/secrets",
    "/tests",
    "/deploy",
    "/scripts",
    "**/*.diff",
    "**/*.report",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra"]
